name: "Copilot Setup Steps"

on:
  workflow_dispatch:

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: copilot

    # Set the permissions to the lowest permissions possible needed
    permissions:
      contents: read

    # Start the rolnopol service just like in the CI workflow
    services:
      rolnopol:
        image: jaktestowac/rolnopol:latest
        ports:
          - 3000:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: cache-browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-browsers-

      - name: Install Playwright browsers
        if: steps.cache-browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser dependencies
        if: steps.cache-browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Wait for rolnopol service
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL is not set. Configure it in repository/environment variables."
            exit 1
          fi
          echo "Waiting for application to be ready at $BASE_URL..."
          for i in {1..30}; do
            if curl -sSf "$BASE_URL/health" || curl -sSf "$BASE_URL"; then
              echo "Service is ready!"
              exit 0
            fi
            echo "Attempt $i/30 failed, retrying in 2 seconds..."
            sleep 2
          done
          echo "Service failed to become ready after 60 seconds"
          exit 1
